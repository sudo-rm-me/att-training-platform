name: Release

# Publishes the public container image to GitHub Container Registry:
#   ghcr.io/<owner>/<repo>:<version>, :<major>.<minor>, :latest
# Push a tag like v1.2.0 (or run manually) to release.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 1.2.0 (creates tag v1.2.0)"
        required: true

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  image:
    name: Build and publish image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          if ! echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$V' is not a semantic version"; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.v.outputs.image }}
          tags: |
            type=semver,pattern={{version}},value=v${{ steps.v.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.v.outputs.version }}
            type=raw,value=latest,enable=${{ !contains(steps.v.outputs.version, '-') }}
          labels: |
            org.opencontainers.image.title=ATT training platform
            org.opencontainers.image.description=Gamified training and training-tracking platform (Next.js + Postgres)

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
          IMAGE: ${{ steps.v.outputs.image }}
        run: |
          if gh release view "v$V" >/dev/null 2>&1; then exit 0; fi
          PRE=""; case "$V" in *-*) PRE="--prerelease";; esac
          cat > notes.md <<EOF
          ## Container image

          \`\`\`
          docker pull $IMAGE:$V
          \`\`\`

          ## Terraform

          \`\`\`hcl
          module "training" {
            source = "github.com/$GITHUB_REPOSITORY//infra/terraform?ref=v$V"
            # see infra/terraform/README.md
          }
          \`\`\`
          EOF
          gh release create "v$V" --target "$GITHUB_SHA" --title "v$V" --notes-file notes.md --generate-notes $PRE
