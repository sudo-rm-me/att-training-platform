<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, "Segoe UI", sans-serif;
        background: radial-gradient(circle at 30% 20%, #3b1d9a, #140d33 70%);
        color: #f5f3ff;
        text-align: center;
        padding: 24px;
      }
      img { width: 96px; height: 96px; }
      h1 { margin: 16px 0 4px; font-size: 1.75rem; }
      p { margin: 0 0 24px; color: #c4b5fd; }
      button {
        border: 0;
        border-radius: 14px;
        padding: 12px 22px;
        font: inherit;
        font-weight: 700;
        color: #fff;
        background: linear-gradient(120deg, #6d4aff, #c045ff, #ff7ab6);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Check your connection. Your course progress is saved, so you can pick up where you left off.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
